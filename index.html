<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Shaman — Assistant</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="theme-color" content="#16233A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Shaman" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #16233A 0%, #101A2C 100%);
    font-family: -apple-system, system-ui, sans-serif;
  }
  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #F1EAD9;
    text-align: center;
    padding: 24px;
  }
  .logo {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  .logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .share-box {
    margin-top: 28px;
    background: #1B2A41;
    border: 1px solid #2C4059;
    border-radius: 16px;
    padding: 18px;
    max-width: 280px;
  }
  .share-box img {
    width: 150px;
    height: 150px;
    border-radius: 10px;
    background: #fff;
    padding: 6px;
  }
  .share-link {
    font-size: 12px;
    color: #93A1B4;
    word-break: break-all;
    margin-top: 10px;
  }
  #copy-link {
    margin-top: 10px;
    background: #223349;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    color: #F1EAD9;
    font-size: 13px;
    cursor: pointer;
  }
  .hint {
    color: #93A1B4;
    font-size: 14px;
    margin-top: 10px;
    max-width: 260px;
  }
  #voice-toggle {
    margin-top: 20px;
    background: #E0A458;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    color: #16233A;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #voice-toggle.off {
    background: #223349;
    color: #93A1B4;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="logo"><img src="./icon-512.png" alt="Shaman" /></div>
  <div style="font-size:20px; font-weight:700;">Shaman</div>
  <div class="hint">Assistant IA · répond au nom de Shaman. Appuie sur la bulle en bas à droite pour discuter.</div>
  <button id="voice-toggle">🔊 Voix activée</button>

  <div class="share-box">
    <div style="font-size:13px; color:#93A1B4; margin-bottom:10px;">Partage ce lien ou ce QR code à ta famille et tes amis :</div>
    <img id="qr-code" src="" alt="QR code" />
    <div class="share-link" id="share-link"></div>
    <button id="copy-link">📋 Copier le lien</button>
  </div>
</div>

<!-- Widget de chat Botpress -->
<script src="https://cdn.botpress.cloud/webchat/v3/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/08/03/08/20260803083655-968F1KI0.js" defer></script>

<script>
  let voiceOn = true;
  const toggleBtn = document.getElementById('voice-toggle');

  toggleBtn.addEventListener('click', () => {
    voiceOn = !voiceOn;
    if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    toggleBtn.textContent = voiceOn ? '🔊 Voix activée' : '🔇 Voix coupée';
    toggleBtn.classList.toggle('off', !voiceOn);
  });

  function speak(text) {
    if (!voiceOn || !window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    utter.rate = 1.02;
    utter.pitch = 0.95;
    window.speechSynthesis.speak(utter);
  }

  function extractBotText(message) {
    return (
      message?.payload?.text ||
      message?.text ||
      (typeof message?.payload === 'string' ? message.payload : '') ||
      ''
    );
  }

  function isBotMessage(message) {
    return (
      message?.direction === 'incoming' ||
      message?.authorRole === 'bot' ||
      message?.from === 'bot' ||
      message?.source === 'bot'
    );
  }

  // On écoute les nouveaux messages du bot pour les lire à voix haute.
  // Botpress a changé son API plusieurs fois selon les versions, donc on
  // couvre les différentes formes possibles pour maximiser les chances
  // que ça marche du premier coup, sans avoir à ajuster après coup.
  function attachListener() {
    let attached = false;

    // Nouvelle API (webchat v2/v3) : window.botpress.on('message', ...)
    if (window.botpress && typeof window.botpress.on === 'function') {
      window.botpress.on('message', (message) => {
        try {
          if (isBotMessage(message)) {
            const text = extractBotText(message);
            if (text) speak(text);
          }
        } catch (e) {
          console.error('Erreur lecture message (API v2/v3):', e);
        }
      });
      attached = true;
    }

    // Ancienne API (webchat v0/v1) : window.botpressWebChat.onEvent(...)
    if (window.botpressWebChat && typeof window.botpressWebChat.onEvent === 'function') {
      window.botpressWebChat.onEvent(
        (event) => {
          try {
            const text = extractBotText(event);
            if (text) speak(text);
          } catch (e) {
            console.error('Erreur lecture message (API v0/v1):', e);
          }
        },
        ['MESSAGE.RECEIVED']
      );
      attached = true;
    }

    if (!attached) {
      // Le widget n'est pas encore chargé, on réessaie un peu plus tard
      setTimeout(attachListener, 500);
    }
  }
  // Génère le QR code et affiche le lien à partager, à partir de l'adresse réelle de la page
  const currentUrl = window.location.href.split('?')[0].split('#')[0];
  document.getElementById('qr-code').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(currentUrl);
  document.getElementById('share-link').textContent = currentUrl;

  document.getElementById('copy-link').addEventListener('click', () => {
    navigator.clipboard.writeText(currentUrl).then(() => {
      const btn = document.getElementById('copy-link');
      const original = btn.textContent;
      btn.textContent = '✅ Lien copié !';
      setTimeout(() => { btn.textContent = original; }, 2000);
    });
  });

  attachListener();

  // Enregistrement du service worker (nécessaire pour l'installation PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => {
        console.error('Erreur service worker:', e);
      });
    });
  }
</script>

</body>
</html>
