<style>
:root{
  --ink:#20304A;
  --ink-2:#3A4C6B;
  --paper:#F1ECDF;
  --paper-2:#E7DFCB;
  --card:#FBF8F1;
  --stamp:#8A2E2A;
  --stamp-2:#B0453E;
  --gold:#A97F2E;
  --green:#3E6B4F;
  --line:#C9BFA4;
  --dotted: repeating-linear-gradient(90deg, var(--ink-2) 0 3px, transparent 3px 8px);
  --shadow: 0 1px 0 rgba(32,48,74,.08), 0 8px 24px -12px rgba(32,48,74,.35);
  --radius: 4px;
}
*{box-sizing:border-box;}
html[data-theme="dark"]{
  --ink:#EDE7D6; --ink-2:#B9AF95; --paper:#161B22; --paper-2:#20262F;
  --card:#1C222B; --line:#333B47; --stamp:#C7524A; --stamp-2:#D9685F;
  --gold:#D3A94E; --green:#5FA37A;
}
html[data-theme="dark"] body{background: radial-gradient(1200px 600px at 100% -10%, #ffffff08, transparent), var(--paper);}
html[data-theme="dark"] .thumb{background:var(--paper-2);}
.theme-toggle{
  background:none;border:1px solid #ffffff30;color:var(--paper);
  border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.lang-toggle{
  background:none;border:1px solid #ffffff30;color:var(--paper);
  border-radius:20px;padding:6px 10px;font-size:11.5px;cursor:pointer;flex:none;
}
.checklist{display:flex; flex-direction:column; gap:10px;}
.checklist label{display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer;}
.checklist input[type=checkbox]{width:18px;height:18px;accent-color:var(--stamp);}
.progressbar{height:8px; background:var(--paper-2); border-radius:6px; overflow:hidden; margin:10px 0;}
.progressbar .fill{height:100%; background:var(--green); transition:width .3s;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 100% -10%, #ffffff20, transparent),
    var(--paper);
  color:var(--ink);
  font-family:'Public Sans', -apple-system, sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces', serif;}
.mono{font-family:'IBM Plex Mono', monospace;}
button{font-family:inherit;}
a{color:inherit;}

/* ---- App shell ---- */
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header.topbar{
  background:var(--ink);
  color:var(--paper);
  padding:14px 18px;
  display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:40;
  box-shadow:var(--shadow);
}
header.topbar .avatar-btn{
  width:40px;height:40px;border-radius:50%;
  border:2px solid var(--gold);
  padding:0; overflow:hidden; flex:none; cursor:pointer;
  background:var(--paper-2);
  -webkit-tap-highlight-color:transparent;
}
header.topbar .avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}
header.topbar .avatar-btn.hide{visibility:hidden;}

.avatar-overlay{
  position:fixed; inset:0; background:rgba(18,24,36,.94);
  display:flex; align-items:center; justify-content:center;
  z-index:100; opacity:0; pointer-events:none;
  transition:opacity .3s ease;
  padding:24px; cursor:zoom-out;
}
.avatar-overlay.show{opacity:1; pointer-events:auto;}
.avatar-overlay img{
  width:min(78vw,360px); height:min(78vw,360px);
  border-radius:50%; object-fit:cover;
  border:3px solid var(--gold);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  transform:scale(.85);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.2);
}
.avatar-overlay.show img{transform:scale(1);}
header.topbar .titles{flex:1; min-width:0;}
header.topbar .titles .t1{font-family:'Fraunces',serif; font-weight:700; font-size:16.5px; line-height:1.15;}
header.topbar .titles .t2{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#C9D3E0; margin-top:1px;}
header.topbar .back{
  background:none;border:1px solid #ffffff30;color:var(--paper);
  padding:7px 11px;border-radius:20px;font-size:12.5px;cursor:pointer;
}
header.topbar .who{font-size:11px;color:#C9D3E0;text-align:right;line-height:1.3;}

main{flex:1; padding:18px 16px 100px;}

/* ---- Home ---- */
.hero{
  text-align:center; padding:34px 10px 22px;
}
.hero .stampmark{
  display:inline-flex;align-items:center;justify-content:center;
  width:84px;height:84px;border-radius:50%;
  border:3px solid var(--gold);
  color:var(--stamp); font-family:'Fraunces',serif; font-weight:700; font-size:26px;
  overflow:hidden;
  margin-bottom:14px;
  cursor:pointer;
}
.hero h1{font-size:26px; margin:0 0 6px; color:var(--ink);}
.hero p{font-size:14px;color:var(--ink-2); max-width:36ch; margin:0 auto;}

.choice-grid{display:grid; gap:14px; margin-top:26px;}
.choice-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  display:flex; align-items:center; gap:14px;
  cursor:pointer; text-align:left;
  box-shadow:var(--shadow);
  transition:transform .15s ease;
}
.choice-card:active{transform:scale(.98);}
.choice-card .icon{
  width:46px;height:46px;border-radius:50%;
  background:var(--paper-2); display:flex;align-items:center;justify-content:center;
  font-size:20px; flex:none;
}
.choice-card .txt h3{margin:0 0 3px;font-size:16px;}
.choice-card .txt p{margin:0;font-size:12.5px;color:var(--ink-2);}

/* ---- Cards / Forms ---- */
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:16px;
}
.panel .head{
  background:var(--paper-2);
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.panel .head h2{font-size:14.5px;margin:0;letter-spacing:.02em;}
.panel .head .num{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--stamp);
  border:1px solid var(--stamp); border-radius:20px; padding:2px 9px;
}
.panel .body{padding:16px;}

.field{margin-bottom:16px;}
.field label{
  display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-2); margin-bottom:6px; font-weight:600;
}
.field input, .field select, .field textarea{
  width:100%; border:none; border-bottom:2px dotted var(--line);
  background:transparent; padding:6px 2px 8px;
  font-size:15px; color:var(--ink); font-family:inherit;
  outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-bottom-color:var(--stamp); border-bottom-style:solid;
}
.field textarea{resize:vertical; min-height:56px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}

fieldset.relgroup{
  border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 12px 2px; margin:0 0 14px;
}
fieldset.relgroup legend{
  font-family:'Fraunces',serif; font-size:13px; padding:0 8px; color:var(--stamp);
}

.section-title{
  font-family:'Fraunces',serif; font-size:15px; margin:22px 0 10px; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

.photo-box{
  display:flex; align-items:center; gap:14px; margin-bottom:18px;
}
.photo-box .thumb{
  width:78px;height:96px; border:2px solid var(--ink); background:var(--paper-2);
  display:flex;align-items:center;justify-content:center; overflow:hidden; flex:none;
  font-size:10px; color:var(--ink-2); text-align:center; border-radius:2px;
}
.photo-box .thumb img{width:100%;height:100%;object-fit:cover;}
.photo-box .actions{display:flex; flex-direction:column; gap:8px;}
.btn-sm{
  border:1px solid var(--ink); background:var(--card); color:var(--ink);
  padding:7px 12px; border-radius:20px; font-size:12.5px; cursor:pointer;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--ink); color:var(--paper);
  border:none; border-radius:24px; padding:13px 20px;
  font-size:14.5px; font-weight:600; cursor:pointer; width:100%;
}
.btn.stamp{background:var(--stamp);}
.btn.ghost{background:transparent;border:1.5px solid var(--ink); color:var(--ink);}
.btn.gold{background:var(--gold);}
.btn:active{transform:scale(.985);}
.btn[disabled]{opacity:.5;}

.hint{font-size:12px;color:var(--ink-2);margin-top:4px;}
.err{color:var(--stamp); font-size:12.5px; margin-top:8px;}
.ok-banner{
  background:#EAF1EC;border:1px solid var(--green);color:var(--green);
  padding:12px 14px;border-radius:var(--radius);font-size:13.5px;margin-bottom:14px;
}

/* ---- Lists / Admin ---- */
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
.statcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 10px; text-align:center;
}
.statcard .n{font-family:'Fraunces',serif; font-size:22px; color:var(--stamp);}
.statcard .l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-top:2px;}

.searchbar{display:flex; gap:8px; margin-bottom:14px;}
.searchbar input{
  flex:1; border:1px solid var(--line); border-radius:20px; padding:10px 14px;
  font-size:14px; background:var(--card); outline:none;
}
.searchbar input:focus{border-color:var(--stamp);}

.rowitem{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:center;
  cursor:pointer;
}
.rowitem .av{
  width:42px;height:42px;border-radius:50%;background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;
  font-family:'Fraunces',serif;color:var(--ink-2);font-size:15px;
}
.rowitem .av img{width:100%;height:100%;object-fit:cover;}
.rowitem .info{flex:1;min-width:0;}
.rowitem .info .n1{font-weight:600;font-size:14.5px;}
.rowitem .info .n2{font-size:12px;color:var(--ink-2);margin-top:2px;}
.badge{
  font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:600;
  white-space:nowrap;
}
.badge.actif{background:#EAF1EC;color:var(--green);}
.badge.termine{background:#EEE7D6;color:var(--gold);}
.badge.dispo{background:#E8EEF5;color:var(--ink-2);}
.badge.attente{background:#FBE9E7;color:var(--stamp);}

.tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto;}
.tabs button{
  flex:none; background:var(--card); border:1px solid var(--line); color:var(--ink-2);
  padding:8px 14px; border-radius:20px; font-size:12.5px; cursor:pointer;
}
.tabs button.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:13.5px;}
.detail-grid .k{color:var(--ink-2); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
.detail-grid .v{margin-bottom:8px;}

.fab{
  position:fixed; bottom:22px; right:calc(50% - 360px + 22px);
  background:var(--stamp); color:#fff; border:none; border-radius:50%;
  width:56px;height:56px; font-size:26px; box-shadow:var(--shadow); cursor:pointer;
  display:flex;align-items:center;justify-content:center; z-index:30;
}
@media (max-width:760px){ .fab{right:22px;} }

.center-msg{text-align:center; color:var(--ink-2); font-size:13.5px; padding:40px 20px;}
.lockscreen{padding-top:60px; text-align:center;}
.lockscreen .padlock{font-size:38px; margin-bottom:10px;}
.codebox{
  width:220px; margin:18px auto 6px; text-align:center; letter-spacing:.3em;
  font-size:20px; padding:12px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--card);
}
.codebox-wrap{ position:relative; width:220px; margin:18px auto 6px; }
.codebox-wrap .codebox{ width:100%; margin:0; padding-right:44px; }
.eye-toggle{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:none; border:none; font-size:19px; cursor:pointer; padding:4px 6px;
  color:var(--ink-2); line-height:1;
}
.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:24px;
  font-size:13px; box-shadow:var(--shadow); z-index:60; opacity:0; transition:opacity .25s;
  max-width:88%; text-align:center;
}
.toast.show{opacity:1;}
footer.foot{
  text-align:center; font-size:10.5px; color:var(--ink-2); padding:16px; opacity:.65;
}
.offline-flag{
  background:var(--gold); color:#fff; text-align:center; font-size:11.5px;
  padding:5px; display:none;
}
.offline-flag.show{display:block;}
@media print{
  header.topbar, .tabs, .searchbar, .fab, .toast, .offline-flag, .btn{display:none !important;}
  #receiptArea{border:none !important; box-shadow:none !important;}
  body{background:#fff;}
}

var qrcode = function() {

  /**

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {

        }

        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {

        } else {

        }

          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {

        } else {
          _modules[8][15 - i - 1] = mod;
        }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;

                bitIndex = 7;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

        var ecCount = rsBlocks[r].totalCount - dcCount;

        return RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];

      case QRErrorCorrectionLevel.H :
        return RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
      default :
        return undefined;

    _this.getRSBlocks = function(typeNumber, errorCorrectionLevel) {

      var rsBlock = getRsBlockTable(typeNumber, errorCorrectionLevel);

      if (typeof rsBlock == 'undefined') {
        throw new Error('bad rs block @ typeNumber:' + typeNumber +
            '/errorCorrectionLevel:' + errorCorrectionLevel);
      }

      var length = rsBlock.length / 3;

      var list = new Array();

      for (var i = 0; i < length; i += 1) {

        var count = rsBlock[i * 3 + 0];
        var totalCount = rsBlock[i * 3 + 1];
        var dataCount = rsBlock[i * 3 + 2];

  var qrBitBuffer = function() {

    var _buffer = new Array();
    var _length = 0;

    _this.getBuffer = function() {

    };

    _this.getAt = function(index) {
      var bufIndex = Math.floor(index / 8);
      return ( (_buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
    };

    _this.put = function(num, length) {
      for (var i = 0; i < length; i += 1) {
        _this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
      }
    };

    _this.getLengthInBits = function() {
      return _length;
    };

    _this.putBit = function(bit) {

      var bufIndex = Math.floor(_length / 8);
      if (_buffer.length <= bufIndex) {
        _buffer.push(0);
      }

      if (bit) {
        _buffer[bufIndex] |= (0x80 >>> (_length % 8) );
      }

      _length += 1;

    return _this;

    };

    _this.getLength = function(buffer) {

    };

    _this.write = function(buffer) {

      var data = _data;

      var i = 0;

      while (i + 2 < data.length) {
        buffer.put(strToNum(data.substring(i, i + 3) ), 10);
        i += 3;
      }

      if (i < data.length) {
        if (data.length - i == 1) {
          buffer.put(strToNum(data.substring(i, i + 1) ), 4);
        } else if (data.length - i == 2) {
          buffer.put(strToNum(data.substring(i, i + 2) ), 7);
        }
      }

    var strToNum = function(s) {
      var num = 0;
      for (var i = 0; i < s.length; i += 1) {
        num = num * 10 + chatToNum(s.charAt(i) );
      }
      return num;
    };

    var chatToNum = function(c) {
      if ('0' <= c && c <= '9') {

    var _mode = QRMode.MODE_ALPHA_NUM;

    _this.getLength = function(buffer) {
      return _data.length;

    _this.write = function(buffer) {

      var s = _data;

      var i = 0;

      while (i + 1 < s.length) {
        buffer.put(
          getCode(s.charAt(i) ) * 45 +
          getCode(s.charAt(i + 1) ), 11);
        i += 2;
      }

      if (i < s.length) {
        buffer.put(getCode(s.charAt(i) ), 6);
      }
    };

    var getCode = function(c) {

      if ('0' <= c && c <= '9') {
        return c.charCodeAt(0) - '0'.charCodeAt(0);
      } else if ('A' <= c && c <= 'Z') {
        return c.charCodeAt(0) - 'A'.charCodeAt(0) + 10;
      } else {
        switch (c) {
        case ' ' : return 36;
        case '$' : return 37;
        case '%' : return 38;
        case '*' : return 39;
        case '+' : return 40;
        case '-' : return 41;
        case '.' : return 42;
        case '/' : return 43;
        case ':' : return 44;

      }

    return;
  }
  const days = getOfflineDays();
  const remaining = Math.max(0, OFFLINE_MAX_DAYS - days);
  if(days >= OFFLINE_MAX_DAYS){
    flag.textContent = "⚠️ Hors connexion depuis plus de " + OFFLINE_MAX_DAYS + " jours — vous pouvez continuer à enregistrer, mais reconnectez-vous dès que possible pour synchroniser vos fiches.";
  }else{
    flag.textContent = "Hors connexion — vous pouvez continuer à travailler normalement. Synchronisation automatique au retour du réseau (encore " + Math.ceil(remaining) + " j avant reconnexion recommandée).";
  }
  flag.classList.add("show");
}

/* ---------- Utilitaires génériques ---------- */
function toDateSafe(v){
  if(!v) return null;
  if(typeof v.toDate === "function") return v.toDate();
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function fmtDate(v){
  const d = toDateSafe(v);
  return d ? d.toLocaleDateString("fr-FR") : "—";
}
function parseAmount(str){
  if(!str) return 0;
  const digits = String(str).replace(/[^\d]/g,"");
  return digits ? parseInt(digits,10) : 0;
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

  if(statut==="Terminé") return "termine";

/* ---------- Compression photo (canvas) ---------- */
function compressImage(file, maxW=480, quality=0.62){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- PARTAGER / QR CODE ---------------- */
routes.share = () => {
  setTop("Ouvrir l'application","Lien & QR Code", true);
  const appUrl = location.origin + location.pathname.replace(/index\.html$/,"");
  let svg = "";
  let qrMissing = false;
  if(typeof qrcode === "function"){
    try{
      const qr = qrcode(0, "M");
      qr.addData(appUrl);
      qr.make();
      svg = qr.createSvgTag(6, 16);
    }catch(e){ console.warn("Erreur génération QR:", e); qrMissing = true; }
  }else{
    qrMissing = true;
  }
  if(qrMissing){
    // Solution de secours automatique si un problème imprévu empêche la génération locale.
    const fallbackUrl = "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(appUrl);
    svg = `<img src="${fallbackUrl}" alt="QR code" width="220" height="220" onerror="this.outerHTML='<p style=&quot;font-size:13px;max-width:220px;&quot;>QR indisponible pour l\\'instant — vérifiez votre connexion internet.</p>'">`;
  }

  mainEl.innerHTML = `
    <div class="panel">
      <div class="head"><h2>Accéder à l'application</h2></div>
      <div class="body" style="text-align:center;">
        <p class="hint" style="margin-bottom:14px;">Scannez ce code avec l'appareil photo du téléphone, ou partagez le lien ci-dessous à vos assistants.</p>
        <div style="background:#fff; display:inline-block; padding:10px; border-radius:8px; border:1px solid var(--line);">${svg}</div>
        ${qrMissing ? `<p class="hint" style="color:var(--stamp); margin-top:10px;">⚠️ Le QR code local n'a pas pu être généré ; celui-ci nécessite une connexion internet. Rechargez la page pour réessayer la version hors-ligne.</p>` : ""}
        <div class="field" style="margin-top:18px; text-align:left;">
          <label>Lien de l'application</label>
          <input id="appLinkInput" value="${appUrl}" readonly>
        </div>
        <button class="btn stamp" id="copyLink" style="margin-top:6px;">📋 Copier le lien</button>
        <p class="hint" style="margin-top:16px;">Une fois le lien ouvert sur un téléphone, utilisez le menu du navigateur → <strong>« Ajouter à l'écran d'accueil »</strong> pour l'installer comme une vraie application.</p>
      </div>
    </div>
  `;
  $("#copyLink").onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(appUrl);
      toast("Lien copié ✓");
    }catch(e){
      $("#appLinkInput").select();
      toast("Sélectionnez et copiez le lien ci-dessus");
    }
  };
};

routes.adminHome = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop(session.role==="supervisor" ? `Superviseur — ${session.region}` : "Espace Administrateur","Vue d'ensemble", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;

  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands= session.region ? list.filter(c=>c.pays===session.region) : list; draw(); });
  DataLayer.listenPlacements(list=>{ places= session.region ? list.filter(p=> cands.some(c=>c.id===p.candidatId)) : list; draw(); });

  function draw(){
    const actifs = places.filter(p=>p.statut==="Actif").length;
    const termines = places.filter(p=>p.statut==="Terminé").length;
    const now = new Date();
    const nonPlaces = cands.filter(c=>{
      if(c.statut!=="Disponible") return false;
      const has = places.some(p=>p.candidatId===c.id && p.statut==="Actif");
      if(has) return false;
      const d = toDateSafe(c.creeLe);
      return d && daysBetween(d, now) >= 30;
    }).length;
    const finProches = places.filter(p=>{
      if(p.statut!=="Actif" || !p.dateFin) return false;
      const d = toDateSafe(p.dateFin);
      if(!d) return false;
      const diff = daysBetween(now, d);
      return diff >= 0 && diff <= 7;
    }).length;
    const commissionTotal = places.reduce((sum,p)=>{
      if(!p.commissionPct) return sum;
      return sum + Math.round(parseAmount(p.salaire) * (parseFloat(p.commissionPct)||0) / 100);
    }, 0);
    const enAttente = places.filter(p=>p.statut==="En attente").length;

    mainEl.innerHTML = `
      <div class="statgrid">
        <div class="statcard"><div class="n">${cands.length}</div><div class="l">Candidats</div></div>
        <div class="statcard"><div class="n">${actifs}</div><div class="l">Placements actifs</div></div>
        <div class="statcard"><div class="n">${termines}</div><div class="l">Terminés</div></div>
      </div>
      ${enAttente>0 ? `
      <div class="panel">
        <div class="head"><h2>🕓 Placements à valider</h2><span class="num mono">${enAttente}</span></div>
        <div class="body">
          <p style="font-size:13.5px;margin:0 0 10px;">${enAttente} placement(s) enregistré(s) par vos assistants attendent votre validation avant d'être activés.</p>
          <button class="btn stamp" id="seeValidation">Examiner et valider</button>
        </div>
      </div>` : ""}
      ${(nonPlaces>0 || finProches>0) ? `
      <div class="panel">
        <div class="head"><h2>⏰ Alertes</h2><span class="num mono">${nonPlaces+finProches}</span></div>
        <div class="body">
          ${nonPlaces>0?`<p style="font-size:13.5px;margin:0 0 8px;">🟠 <strong>${nonPlaces}</strong> candidat(e)s disponibles depuis plus de 30 jours sans placement.</p>`:""}
          ${finProches>0?`<p style="font-size:13.5px;margin:0;">🔴 <strong>${finProches}</strong> placement(s) se terminent dans les 7 prochains jours.</p>`:""}
          <button class="btn ghost" id="seeAlerts" style="margin-top:10px;">Voir le détail</button>
        </div>
      </div>` : ""}
      <div class="choice-grid">
        <button class="choice-card" id="newCandAdmin">
          <div class="icon">📇</div>
          <div class="txt"><h3>Nouvelle fiche candidat(e)</h3><p>Enregistrer un(e) candidat(e) vous-même</p></div>
        </button>
        <button class="choice-card" id="newPlacementAdmin">
          <div class="icon">🤝</div>
          <div class="txt"><h3>Nouveau placement</h3><p>Créer un placement (activé immédiatement)</p></div>

        <button class="choice-card" id="toCands">

        <button class="choice-card" id="toPlace">

routes.performance = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop("Performance par agent","Vue d'ensemble par personne", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands= session.region ? list.filter(c=>c.pays===session.region) : list; draw(); });
  DataLayer.listenPlacements(list=>{ places= session.region ? list.filter(p=> cands.some(c=>c.id===p.candidatId)) : list; draw(); });

  function draw(){
    const agents = new Set([...cands.map(c=>c.agentNom), ...places.map(p=>p.agentNom)].filter(Boolean));
    const rows = [...agents].map(a=>{
      const nbFiches = cands.filter(c=>c.agentNom===a).length;
      const mine = places.filter(p=>p.agentNom===a);
      const valides = mine.filter(p=>p.statut==="Actif"||p.statut==="Terminé").length;
      const rejetes = mine.filter(p=>p.statut==="Rejeté").length;
      return {a, nbFiches, nbPlacements:mine.length, valides, rejetes};
    }).sort((x,y)=> (y.nbFiches+y.nbPlacements) - (x.nbFiches+x.nbPlacements));

    mainEl.innerHTML = rows.length ? `
      <div class="panel"><div class="body">
        ${rows.map(r=>`
          <div class="rowitem" style="cursor:default; align-items:flex-start;">
            <div class="av">👤</div>
            <div class="info">
              <div class="n1">${r.a}</div>
              <div class="n2">${r.nbFiches} fiche(s) candidat(e) · ${r.nbPlacements} placement(s) (${r.valides} validé(s)${r.rejetes?`, ${r.rejetes} rejeté(s)`:""})</div>
            </div>
          </div>
        `).join("")}
      </div></div>
    ` : `<div class="center-msg">Aucune donnée d'activité pour l'instant.</div>`;
  }
};

routes.validation = () => {

      const cand = cands.find(c=>c.id===p.candidatId);
      return `
      <div class="panel" data-pid="${p.id}">

          <div class="section-title">Informations sur l'employé(e)</div>
          <div class="detail-grid">
            <div><div class="k">Nom complet</div><div class="v">${p.candidatNom||"—"}</div></div>
            <div><div class="k">Contact</div><div class="v">${cand ? (cand.contact||"—") : "—"}</div></div>
            <div><div class="k">Domicile</div><div class="v">${cand ? (cand.domicile||"—") : "—"}</div></div>
            <div><div class="k">Domaine</div><div class="v">${cand ? (cand.domaineCompetence||"—") : "—"}</div></div>
          </div>

          <div class="section-title">Informations sur l'employeur</div>
          <div class="detail-grid">
            <div><div class="k">Employeur</div><div class="v">${p.employeur||"—"}</div></div>
            <div><div class="k">Contact employeur</div><div class="v">${p.employeurContact||"—"}</div></div>
            <div><div class="k">Pays du poste</div><div class="v">${p.paysEmployeur||"—"}</div></div>
            <div><div class="k">Tâche</div><div class="v">${p.tache||"—"}</div></div>
            <div><div class="k">Salaire proposé</div><div class="v">${fmtMoney(p.salaire,p.devise)}</div></div>
            <div><div class="k">Date de début</div><div class="v">${p.dateDebut||"—"}</div></div>
          </div>
          ${p.appreciation?`<div class="section-title">Note de l'agent</div><p style="font-size:13.5px;">${p.appreciation}</p>`:""}

          <div style="display:flex; gap:10px; margin-top:14px;">
            <button class="btn stamp" data-action="valider" style="flex:1;">✅ Valider</button>
            <button class="btn ghost" data-action="rejeter" style="flex:1;">✖️ Rejeter</button>
          </div>
        </div>
      </div>`;
    }).join("") : `<div class="center-msg">Aucun placement en attente de validation. 👍</div>`;

    mainEl.querySelectorAll("[data-action]").forEach(btn=>{
      btn.onclick = async ()=>{
        const panel = btn.closest("[data-pid]");
        const pid = panel.dataset.pid;
        const p = pending.find(x=>x.id===pid);
        if(btn.dataset.action === "valider"){
          await DataLayer.updatePlacement(pid, {statut: p.dateFin ? "Terminé" : "Actif", valideParAdmin:true, valideLe:new Date().toISOString()});
          toast("Placement validé et activé ✓");
        }else{
          const reason = prompt("Motif du rejet (visible par l'agent) :", "");
          if(reason === null) return;
          await DataLayer.updatePlacement(pid, {statut:"Rejeté", rejeteLe:new Date().toISOString(), rejectReason: reason || "Non précisé"});
          toast("Placement rejeté");
        }
      };
    });
  }
};

routes.geo = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop("Répartition géographique","Candidats et placements par pays", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands= session.region ? list.filter(c=>c.pays===session.region) : list; draw(); });
  DataLayer.listenPlacements(list=>{ places= session.region ? list.filter(p=> cands.some(c=>c.id===p.candidatId)) : list; draw(); });
  function draw(){
    const byPays = {};
    cands.forEach(c=>{ const p = c.pays || "Non renseigné"; byPays[p] = byPays[p] || {candidats:0, placements:0}; byPays[p].candidats++; });
    places.forEach(pl=>{
      const cand = cands.find(c=>c.id===pl.candidatId);
      const p = (cand && cand.pays) || "Non renseigné";
      byPays[p] = byPays[p] || {candidats:0, placements:0};
      byPays[p].placements++;
    });
    const rows = Object.entries(byPays).sort((a,b)=>b[1].candidats-a[1].candidats);
    const max = Math.max(1, ...rows.map(r=>r[1].candidats));
    mainEl.innerHTML = rows.length ? `
      <div class="panel"><div class="body">
        ${rows.map(([pays,d])=>`
          <div style="margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px;">
              <strong>${pays}</strong><span class="hint">${d.candidats} candidat(e)s · ${d.placements} placement(s)</span>
            </div>
            <div class="progressbar"><div class="fill" style="width:${Math.round(d.candidats/max*100)}%; background:var(--stamp);"></div></div>
          </div>
        `).join("")}
      </div></div>
    ` : `<div class="center-msg">Aucune donnée géographique pour l'instant. Renseignez le pays sur les fiches candidats.</div>`;
  }
};

/* ---------------- OUTIL : TABLEAU DE BORD GRAPHIQUE ---------------- */
routes.dashboard = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop("Tableau de bord","Évolution de l'activité", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands=list; draw(); });
  DataLayer.listenPlacements(list=>{ places=list; draw(); });

  function monthBuckets(list, field){
    const buckets = {};
    const now = new Date();
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      buckets[d.getFullYear()+"-"+d.getMonth()] = 0;
    }
    list.forEach(item=>{
      const d = toDateSafe(item[field]);
      if(!d) return;
      const key = d.getFullYear()+"-"+d.getMonth();
      if(key in buckets) buckets[key] += 1;
    });
    return buckets;
  }
  const moisNoms = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
  function drawBars(buckets, color){
    const vals = Object.entries(buckets);
    const max = Math.max(1, ...vals.map(v=>v[1]));
    return `<div style="display:flex; align-items:flex-end; gap:8px; height:110px; padding:8px 0;">
      ${vals.map(([key,val])=>{
        const m = parseInt(key.split("-")[1],10);
        const h = Math.round((val/max)*90) + 6;
        return `<div style="flex:1; text-align:center;">
          <div style="height:${h}px; background:${color}; border-radius:3px 3px 0 0; margin:0 auto; width:60%;"></div>
          <div style="font-size:10px; color:var(--ink-2); margin-top:4px;">${moisNoms[m]}</div>
          <div style="font-size:11px; font-weight:600;">${val}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function draw(){
    mainEl.innerHTML = `
      <div class="panel">
        <div class="head"><h2>Nouvelles fiches candidats / mois</h2></div>
        <div class="body">${drawBars(monthBuckets(cands,"creeLe"), "var(--stamp)")}</div>
      </div>
      <div class="panel">
        <div class="head"><h2>Nouveaux placements / mois</h2></div>
        <div class="body">${drawBars(monthBuckets(places,"creeLe"), "var(--green)")}</div>
      </div>
    `;
  }
};

routes.alertes = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop("Alertes","Suivi proactif", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands=list; draw(); });
  DataLayer.listenPlacements(list=>{ places=list; draw(); });

  function draw(){
    const now = new Date();
    const nonPlaces = cands.filter(c=>{
      if(c.statut!=="Disponible") return false;
      const has = places.some(p=>p.candidatId===c.id && p.statut==="Actif");
      if(has) return false;
      const d = toDateSafe(c.creeLe);
      return d && daysBetween(d, now) >= 30;
    });
    const finProches = places.filter(p=>{
      if(p.statut!=="Actif" || !p.dateFin) return false;
      const d = toDateSafe(p.dateFin);
      if(!d) return false;
      const diff = daysBetween(now, d);
      return diff >= 0 && diff <= 7;
    });
    mainEl.innerHTML = `
      <div class="panel">
        <div class="head"><h2>🟠 Candidats disponibles depuis +30 jours</h2><span class="num mono">${nonPlaces.length}</span></div>
        <div class="body">
          ${nonPlaces.length ? nonPlaces.map(c=>`

          ${finProches.length ? finProches.map(p=>`

          <button class="btn stamp" id="exportJson" style="margin-bottom:10px;">💾 Télécharger la sauvegarde (JSON)</button>
          <button class="btn ghost" id="exportCsv2">📊 Télécharger en CSV (Excel)</button>
        </div>
      </div>
    `;
    $("#exportJson").onclick = ()=>{
      const blob = new Blob([JSON.stringify({exporteLe:new Date().toISOString(), candidats:cands, placements:places}, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "shaman_bara_center_sauvegarde_"+new Date().toISOString().slice(0,10)+".json";
      a.click();
    };
    $("#exportCsv2").onclick = ()=> exportCSV(cands, places);

function exportCSV(cands, places){
  function toCSV(rows){
    if(!rows.length) return "";
    const keys = Object.keys(rows[0]).filter(k=>k!=="photo");
    const lines = [keys.join(";")];
    rows.forEach(r=> lines.push(keys.map(k=> `"${(r[k]??"").toString().replace(/"/g,'""')}"`).join(";")));
    return lines.join("\n");
  }
  const blob = new Blob(["CANDIDATS\n"+toCSV(cands)+"\n\nPLACEMENTS\n"+toCSV(places)], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shaman_bara_center_export.csv";
  a.click();
}

    mainEl.innerHTML = `
      <div class="panel">
        <div class="head"><h2>${cand.nom||""} ${cand.prenoms||""}</h2></div>
        <div class="body">
          <div class="photo-box">
            <div class="thumb" id="candThumbId" style="${cand.photo?'cursor:pointer;':''}">${cand.photo?`<img src="${cand.photo}">`:"PHOTO"}</div>
            ${cand.photoEntiere?`<div class="thumb" id="candThumbFull" style="width:78px;height:96px;cursor:pointer;"><img src="${cand.photoEntiere}"></div>`:""}
            <div class="detail-grid" style="flex:1;">
              <div><div class="k">Contact</div><div class="v">${cand.contact||"—"}</div></div>
              <div><div class="k">Âge</div><div class="v">${cand.age||"—"}</div></div>
              <div><div class="k">Domicile</div><div class="v">${cand.domicile||"—"}</div></div>
              <div><div class="k">Situation</div><div class="v">${cand.situationMatrimoniale||"—"}</div></div>
            </div>
          </div>
          ${(cand.galerie&&cand.galerie.length) ? `
          <div class="section-title">Galerie de photos (${cand.galerie.length})</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
            ${cand.galerie.map(src=>`<img src="${src}" style="width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer;" class="galThumb">`).join("")}
          </div>` : ""}
          <div class="section-title">Études &amp; compétences</div>
          <div class="detail-grid">
            <div><div class="k">Niveau</div><div class="v">${cand.niveauEtude||"—"}</div></div>
            <div><div class="k">Langues</div><div class="v">${cand.langues||"—"}</div></div>
            <div><div class="k">Domaine</div><div class="v">${cand.domaineCompetence||"—"}</div></div>
            <div><div class="k">Salaire souhaité</div><div class="v">${cand.salaireSouhaite||"—"}</div></div>
          </div>
          ${cand.experiences?`<div class="section-title">Expériences</div><p style="font-size:13.5px;">${cand.experiences}</p>`:""}
          ${isAdminish() ? `
          <div class="section-title">🔤 Traduction</div>
          <div class="row2" style="align-items:end;">
            <div class="field" style="margin-bottom:0;"><label>Traduire vers</label>
              <select id="translateLang">${Object.entries(LANG_NAMES).map(([c,n])=>`<option value="${c}">${n}</option>`).join("")}</select>
            </div>
            <button class="btn-sm" id="translateBtn" style="margin-bottom:2px;">Traduire cette fiche</button>
          </div>
          <div id="translateResult"></div>
          ` : ""}
          <div class="section-title">Famille &amp; références</div>
          <div class="detail-grid">
            ${Object.entries(relLabels).filter(([k])=>cand[k+"_nom"]).map(([k,label])=>`
              <div><div class="k">${label}</div><div class="v">${cand[k+"_nom"]||""} — ${cand[k+"_contact"]||""}</div></div>
            `).join("") || `<div class="hint">Aucune référence renseignée.</div>`}
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="head"><h2>Historique de placement</h2></div>
        <div class="body">
          ${places.length ? places.map(p=>`
            <div class="rowitem" style="cursor:default;">
              <div class="av">🤝</div>
              <div class="info"><div class="n1">${p.employeur}</div><div class="n2">${p.tache} · ${p.salaire||""}</div></div>
              <span class="badge ${placeBadgeClass(p.statut)}">${p.statut}</span>
            </div>`).join("") : `<p class="hint">Aucun placement enregistré pour ce/cette candidat(e).</p>`}
          <button class="btn ghost" id="newPlaceFor" style="margin-top:8px;">+ Nouveau placement pour ce/cette candidat(e)</button>
        </div>
      </div>
      <div class="panel">
        <div class="head"><h2>Notes internes</h2></div>
        <div class="body">
          ${(cand.notes&&cand.notes.length) ? cand.notes.slice().reverse().map(n=>`
            <div style="border-bottom:1px solid var(--line); padding:8px 0; font-size:13.5px;">
              <div>${(n.texte||"").replace(/</g,"&lt;")}</div>
              <div class="hint" style="margin-top:3px;">${n.agent||"—"} · ${fmtDate(n.ts)}</div>
            </div>
          `).join("") : `<p class="hint" style="margin-top:0;">Aucune note pour l'instant.</p>`}
          <div class="field" style="margin-top:12px;"><textarea id="newNoteInput" placeholder="Ajouter une note de suivi…"></textarea></div>
          <button class="btn ghost" id="addNoteBtn">+ Ajouter la note</button>
        </div>
      </div>
    `;
    $("#newPlaceFor").onclick = ()=> nav("placementForm",{candidatId:cand.id});
    mainEl.querySelectorAll(".galThumb").forEach(img=> img.onclick = ()=> openImage(img.src));
    const idThumb = $("#candThumbId");
    if(idThumb && cand.photo) idThumb.onclick = ()=> openImage(cand.photo);
    const fullThumb = $("#candThumbFull");
    if(fullThumb && cand.photoEntiere) fullThumb.onclick = ()=> openImage(cand.photoEntiere);
    const trBtn = $("#translateBtn");
    if(trBtn) trBtn.onclick = async ()=>{
      const target = $("#translateLang").value;
      const box = $("#translateResult");
      box.innerHTML = `<p class="hint">Traduction en cours…</p>`;
      const fields = [["Domaine",cand.domaineCompetence],["Expériences",cand.experiences],["Salaire souhaité",cand.salaireSouhaite]].filter(([,v])=>v);
      if(!fields.length){ box.innerHTML = `<p class="hint">Rien à traduire sur cette fiche.</p>`; return; }
      try{
        const results = await Promise.all(fields.map(async ([label,text])=>{
          const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|${target}`);
          const json = await res.json();
          return [label, json.responseData ? json.responseData.translatedText : text];
        }));
        box.innerHTML = `<div class="panel" style="margin-top:10px;"><div class="body">${results.map(([l,tx])=>`<div style="margin-bottom:8px;"><strong style="font-size:12.5px;">${l}</strong><p style="font-size:13.5px;margin:2px 0 0;">${tx}</p></div>`).join("")}</div></div>`;
      }catch(e){
        box.innerHTML = `<p class="hint" style="color:var(--stamp);">Traduction indisponible (nécessite une connexion internet).</p>`;
      }
    };
    $("#addNoteBtn").onclick = async ()=>{
      const txt = $("#newNoteInput").value.trim();
      if(!txt) return;
      await DataLayer.addNote(cand.id, {texte:txt, agent:getAgentName()||(session.role==="admin"?"Administrateur":"Agent"), ts:new Date().toISOString()});
      toast("Note ajoutée ✓");
    };
  }
};

/* ---------------- DÉTAIL PLACEMENT ---------------- */
routes.placementDetail = async (params) => {
  setTop("Fiche de suivi","Placement", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  DataLayer.listenPlacements(list=>{
    const p = list.find(x=>x.id===params.id);
    if(!p){ mainEl.innerHTML = `<div class="center-msg">Introuvable.</div>`; return; }
    const etoiles = p.noteEtoiles ? "★".repeat(+p.noteEtoiles) + "☆".repeat(5-(+p.noteEtoiles)) : null;
    const commission = p.commissionPct ? Math.round(parseAmount(p.salaire)*(parseFloat(p.commissionPct)||0)/100) : null;
    const checks = [["ckContrat","Contrat signé"],["ckAssurance","Assurance santé"],["ckVisa","Visa/autorisation"],["ckBillet","Billet de voyage"]];
    const doneCount = checks.filter(([k])=>p[k]).length;
    const pct = Math.round(doneCount/checks.length*100);
    mainEl.innerHTML = `
      <div class="panel" id="receiptArea">
        <div class="head"><h2>${p.employeur}</h2><span class="badge ${placeBadgeClass(p.statut)}">${p.statut}</span></div>
        <div class="body">
          <div class="detail-grid">
            <div><div class="k">Candidat(e)</div><div class="v">${p.candidatNom||"—"}</div></div>
            <div><div class="k">Contact employeur</div><div class="v">${p.employeurContact||"—"}</div></div>
            <div><div class="k">Tâche</div><div class="v">${p.tache||"—"}</div></div>
            <div><div class="k">Salaire</div><div class="v">${fmtMoney(p.salaire,p.devise)}</div></div>
            <div><div class="k">Pays du poste</div><div class="v">${p.paysEmployeur||"—"}</div></div>
            <div><div class="k">Date de début</div><div class="v">${p.dateDebut||"—"}</div></div>
            <div><div class="k">Date de fin</div><div class="v">${p.dateFin||"En cours"}</div></div>
            ${etoiles?`<div><div class="k">Évaluation</div><div class="v">${etoiles}</div></div>`:""}
            ${commission!==null?`<div><div class="k">Commission agence</div><div class="v">${p.commissionPct}% = ${fmtMoney(commission,p.devise)}</div></div>`:""}
          </div>
          <div class="section-title">Conformité (${doneCount}/4)</div>
          <div class="progressbar"><div class="fill" style="width:${pct}%;"></div></div>
          <div class="checklist" style="font-size:13px;">
            ${checks.map(([k,label])=>`<div>${p[k]?"✅":"⬜️"} ${label}</div>`).join("")}
          </div>
          ${p.appreciation?`<div class="section-title">Appréciation</div><p style="font-size:13.5px;">${p.appreciation}</p>`:""}
          <div class="section-title">Agence</div>
          <p style="font-size:12.5px;color:var(--ink-2);">AGENCE SHAMAN CHOOZ PRODUCTION — Fiche de suivi de placement</p>
          ${p.statut==="Actif" && isAdminish() ? `<button class="btn gold" id="closeIt" style="margin-top:14px;">Marquer comme terminé</button>`:""}
          <button class="btn ghost" id="printReceipt" style="margin-top:10px;">🧾 Imprimer / enregistrer en PDF</button>
        </div>
      </div>
    `;
    const closeBtn = $("#closeIt");
    if(closeBtn) closeBtn.onclick = async ()=>{
      await DataLayer.updatePlacement(p.id, {statut:"Terminé", dateFin: new Date().toISOString().slice(0,10)});
      toast("Placement clôturé ✓");
    };
    $("#printReceipt").onclick = ()=> window.print();
  });
};

/* ---- Photo de profil : plein écran au clic, retour en un clic ---- */
const avatarBtn = $("#avatarBtn");
const avatarOverlay = $("#avatarOverlay");
function openAvatar(){ avatarOverlay.classList.add("show"); }
function closeAvatar(){
  avatarOverlay.classList.remove("show");
  // Remet la photo de profil par défaut si une autre image a été affichée
  $("#avatarOverlayImg").src = "profile-full.jpg";
}
function openImage(src){ $("#avatarOverlayImg").src = src; avatarOverlay.classList.add("show"); }
avatarBtn.addEventListener("click", openAvatar);
avatarOverlay.addEventListener("click", closeAvatar);

/* ---- Boutons thème / langue (globaux, dans l'en-tête) ---- */
$("#themeToggle").addEventListener("click", ()=>{
  applyTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
});
$("#langToggle").textContent = getLang().toUpperCase();
$("#langToggle").addEventListener("click", ()=>{
  setLang(getLang()==="fr" ? "en" : "fr");
  $("#langToggle").textContent = getLang().toUpperCase();
  render();
});

/* ---- Service worker ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
